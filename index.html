<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#F7E6E3;      /* pink pucat latar seksi */
    --rose:#C98A93;       /* pink mawar kusam, aksen utama */
    --rose-deep:#A8636F;  /* tombol, garis */
    --paper:#FFFCF9;      /* putih hangat */
    --kraft:#B89A82;      /* cokelat kraft, bingkai rustik */
    --ink:#4E3436;        /* teks */
    --ink-soft:#7B5F60;
    --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--paper);
    line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden;height:100vh}
  .wrap{max-width:480px;margin:0 auto;position:relative}
  h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.15}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px}

  /* ===== Ornamen ===== */
  .sprig{width:84px;height:auto;color:var(--rose);display:block;margin:0 auto}
  .rule{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--kraft);margin:18px auto}
  .rule::before,.rule::after{content:"";height:1px;width:56px;background:currentColor;opacity:.7}

  /* ===== Cover ===== */
  #cover{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.7), transparent 45%),
      linear-gradient(180deg,#FBEDEA 0%, #F3D9D7 100%);
    background-size:cover;background-position:center;
    transition:transform 1s cubic-bezier(.7,0,.2,1), opacity .4s ease .7s;
  }
  #cover.has-photo::before{
    content:"";position:absolute;inset:0;background:inherit;opacity:.0;
  }
  #cover .overlay{position:absolute;inset:0;background:rgba(255,248,246,.82)}
  #cover.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
  .cover-card{
    position:relative;width:100%;max-width:360px;padding:44px 26px 38px;
    background:var(--paper);
    border:1px solid var(--kraft);
    outline:1px dashed var(--kraft);outline-offset:-9px;  /* jahitan kertas kraft */
    border-radius:180px 180px 6px 6px;                  /* bentuk lengkung */
    box-shadow:0 18px 40px -22px rgba(78,52,54,.45);
  }
  .cover-card .small{font-size:.95rem;color:var(--ink-soft);letter-spacing:.04em}
  .cover-card h1{font-size:3.1rem;font-style:italic;color:var(--rose-deep);margin:10px 0 2px}
  .cover-card .amp{font-size:1.9rem;color:var(--kraft);display:block;line-height:1}
  .cover-card .date{font-family:var(--serif);font-size:1.25rem;margin-top:14px}
  .guest{margin-top:22px;font-size:.9rem;color:var(--ink-soft)}
  .guest strong{display:block;font-family:var(--serif);font-weight:600;font-size:1.35rem;color:var(--ink);margin-top:2px}
  .btn{
    display:inline-block;margin-top:24px;padding:13px 30px;border:0;border-radius:999px;cursor:pointer;
    background:var(--rose-deep);color:#fff;font:400 .95rem var(--sans);letter-spacing:.03em;text-decoration:none;
    box-shadow:0 8px 18px -10px rgba(168,99,111,.9);transition:transform .2s, background .2s;
  }
  .btn:hover{background:#94525E;transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--rose-deep);border:1px solid var(--rose-deep);box-shadow:none}
  .btn.ghost:hover{background:var(--blush)}

  /* ===== Konten ===== */
  #content{visibility:hidden}
  #content.show{visibility:visible}
  section{padding:68px 26px;text-align:center}
  section.alt{background:var(--blush)}

  .hero{padding-top:80px}
  .hero .small{color:var(--ink-soft)}
  .hero h2{font-size:3.4rem;font-style:italic;color:var(--rose-deep);margin:12px 0 4px}
  .hero .date{font-family:var(--serif);font-size:1.4rem;margin-bottom:34px}

  /* countdown */
  .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:340px;margin:0 auto}
  .cd div{
    background:var(--paper);border:1px solid var(--kraft);border-radius:4px;padding:14px 4px 10px;
    outline:1px dashed rgba(184,154,130,.7);outline-offset:-5px;
  }
  .cd b{display:block;font-family:var(--serif);font-weight:600;font-size:2rem;color:var(--rose-deep);line-height:1}
  .cd span{font-size:.78rem;color:var(--ink-soft)}
  .cd-done{font-family:var(--serif);font-size:1.5rem;font-style:italic;color:var(--rose-deep);display:none}

  .quote{max-width:380px;margin:0 auto;font-family:var(--serif);font-size:1.18rem;font-style:italic;color:var(--ink-soft)}

  /* mempelai */
  h3.sec{font-size:2.1rem;color:var(--rose-deep);margin-bottom:6px}
  .couple{display:grid;gap:46px;margin-top:34px}
  .arch{
    width:230px;height:300px;margin:0 auto 22px;position:relative;
    border-radius:115px 115px 6px 6px;overflow:hidden;
    border:1px solid var(--kraft);padding:8px;background:var(--paper);
    box-shadow:0 16px 34px -20px rgba(78,52,54,.5);
  }
  .arch .ph{
    width:100%;height:100%;border-radius:107px 107px 2px 2px;overflow:hidden;background:var(--blush);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-style:italic;font-size:5rem;color:var(--rose);
  }
  .arch img{width:100%;height:100%;object-fit:cover;display:block}
  .person h4{font-family:var(--serif);font-weight:600;font-size:1.75rem}
  .person p{max-width:300px;margin:6px auto 0;color:var(--ink-soft);font-size:.98rem}
  .and{font-family:var(--serif);font-style:italic;font-size:2.6rem;color:var(--kraft);line-height:1;margin:-18px 0}

  /* acara */
  .event{
    background:var(--paper);border:1px solid var(--kraft);outline:1px dashed var(--kraft);outline-offset:-8px;
    padding:36px 24px;margin:26px auto 0;max-width:380px;border-radius:4px;
  }
  .event h4{font-family:var(--serif);font-size:1.9rem;font-weight:600;color:var(--rose-deep)}
  .event .day{font-family:var(--serif);font-size:1.3rem;margin-top:8px}
  .event .time{color:var(--ink-soft)}
  .event .place{margin-top:14px;font-size:.98rem}
  .event .btn{margin-top:20px}

  footer{padding:60px 26px 80px;text-align:center}
  footer p.msg{max-width:360px;margin:0 auto;color:var(--ink-soft)}
  footer .names{font-family:var(--serif);font-style:italic;font-size:2.4rem;color:var(--rose-deep);margin-top:24px}
  footer .sal{margin-top:26px;font-size:.95rem;color:var(--ink-soft)}

  /* ===== Tombol Musik Melayang ===== */
  .btn-music {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--rose-deep);
    border: 2px solid var(--paper);
    font-size: 1.2rem;
    cursor: pointer;
    z-index: 100;
    box-shadow: 0 4px 12px rgba(168,99,111,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spin 4s linear infinite;
  }
  .btn-music.paused {
    animation: none;
    opacity: 0.6;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* animasi: hanya satu momen, saat undangan dibuka */
  #content.show .hero > *{animation:rise .9s ease both}
  #content.show .hero > *:nth-child(2){animation-delay:.1s}
  #content.show .hero > *:nth-child(3){animation-delay:.2s}
  #content.show .hero > *:nth-child(4){animation-delay:.3s}
  #content.show .hero > *:nth-child(5){animation-delay:.4s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
  @media (min-width:481px){
    body{background:#EBD3D0}
    .wrap{background:var(--paper);box-shadow:0 0 60px rgba(78,52,54,.18)}
  }
</style>
</head>
<body class="locked">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sprig" viewBox="0 0 120 40">
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M8 20 C40 14 80 26 112 20"/>
    </g>
    <g fill="currentColor" opacity=".85">
      <ellipse cx="26" cy="14" rx="8" ry="3.2" transform="rotate(-25 26 14)"/>
      <ellipse cx="44" cy="25" rx="8" ry="3.2" transform="rotate(25 44 25)"/>
      <ellipse cx="62" cy="15" rx="8" ry="3.2" transform="rotate(-25 62 15)"/>
      <ellipse cx="80" cy="25" rx="8" ry="3.2" transform="rotate(25 80 25)"/>
      <ellipse cx="98" cy="15" rx="8" ry="3.2" transform="rotate(-25 98 15)"/>
      <circle cx="112" cy="20" r="3.4"/>
    </g>
  </symbol>
</svg>

<div id="cover" role="dialog" aria-label="Cover undangan">
  <div class="overlay"></div>
  <div class="cover-card">
    <svg class="sprig" viewBox="0 0 120 40" aria-hidden="true"><use href="#sprig"/></svg>
    <p class="small" style="margin-top:14px">Undangan Pernikahan</p>
    <h1><span id="cv-pria"></span><span class="amp">&amp;</span><span id="cv-wanita"></span></h1>
    <p class="date" id="cv-tanggal"></p>
    <p class="guest" id="cv-guest" hidden>Kepada Yth. Bapak/Ibu/Saudara/i<strong id="cv-nama"></strong></p>
    <button class="btn" id="btn-open" type="button">Memuat data...</button>
  </div>
</div>

<main id="content" class="wrap">
  <section class="hero">
    <svg class="sprig" viewBox="0 0 120 40" aria-hidden="true"><use href="#sprig"/></svg>
    <p class="small">Kami mengundang Anda ke pernikahan</p>
    <h2><span id="h-pria"></span> &amp; <span id="h-wanita"></span></h2>
    <p class="date" id="h-tanggal"></p>
    <div>
      <div class="cd" id="cd" role="timer" aria-live="off">
        <div><b id="cd-d">0</b><span>Hari</span></div>
        <div><b id="cd-h">0</b><span>Jam</span></div>
        <div><b id="cd-m">0</b><span>Menit</span></div>
        <div><b id="cd-s">0</b><span>Detik</span></div>
      </div>
      <p class="cd-done" id="cd-done">Hari bahagia telah tiba</p>
    </div>
  </section>

  <section class="alt">
    <p class="quote" id="kata-pembuka"></p>
  </section>

  <section id="mempelai">
    <h3 class="sec">Mempelai</h3>
    <div class="rule"><svg width="26" height="9" viewBox="0 0 120 40" class="sprig" style="width:26px;margin:0"><use href="#sprig"/></svg></div>
    <div class="couple">
      <div class="person">
        <div class="arch"><div class="ph" id="ph-pria"></div></div>
        <h4 id="p-nama"></h4>
        <p id="p-anak"></p>
      </div>
      <div class="and" aria-hidden="true">&amp;</div>
      <div class="person">
        <div class="arch"><div class="ph" id="ph-wanita"></div></div>
        <h4 id="w-nama"></h4>
        <p id="w-anak"></p>
      </div>
    </div>
  </section>

  <section class="alt" id="acara">
    <h3 class="sec">Waktu dan Tempat</h3>
    <div class="event">
      <h4 id="ak-judul"></h4>
      <p class="day" id="ak-hari"></p>
      <p class="time" id="ak-waktu"></p>
      <p class="place" id="ak-tempat"></p>
      <a class="btn" id="ak-maps" target="_blank" rel="noopener">Buka Google Maps</a>
    </div>
    <div class="event">
      <h4 id="rs-judul"></h4>
      <p class="day" id="rs-hari"></p>
      <p class="time" id="rs-waktu"></p>
      <p class="place" id="rs-tempat"></p>
      <a class="btn" id="rs-maps" target="_blank" rel="noopener">Buka Google Maps</a>
    </div>
  </section>

  <footer>
    <svg class="sprig" viewBox="0 0 120 40" aria-hidden="true"><use href="#sprig"/></svg>
    <p class="msg" id="kata-penutup" style="margin-top:18px"></p>
    <p class="sal">Kami yang berbahagia</p>
    <p class="names"><span id="f-pria"></span> &amp; <span id="f-wanita"></span></p>
  </footer>
</main>

<!-- ===== Elemen Audio & Tombol Musik ===== -->
<audio id="bg-music" loop preload="auto"></audio>
<button id="btn-music" class="btn-music" style="display:none;" aria-label="Putar atau jeda musik">🎵</button>

<script>
  // Link API dari Google Script
  const scriptUrl = "https://script.google.com/macros/s/AKfycbyrRgUJtaCBA43XeTmnvbYQO8YKo0c-KjrQ6qf5xp-YTX3XLxaa_bQdEQjQxF2zOFzy/exec";

  const btnOpen = document.getElementById('btn-open');

  // Ambil data dari Google Sheet via JSON API
  fetch(scriptUrl)
    .then(response => response.json())
    .then(CFG => {

      // Ambil parameter '?to=Nama+Tamu' dari URL
      const urlParams = new URLSearchParams(window.location.search);
      const tamu = urlParams.get('to');
      if (tamu) {
        CFG.tamu = tamu;
      }

      const $ = id => document.getElementById(id);
      const txt = (id, v) => { const el = $(id); if (el) el.textContent = v || ''; };

      // Judul tab browser
      if (CFG.judul_halaman) document.title = CFG.judul_halaman;

      // Mengisi Teks
      txt('cv-pria', CFG.pria_panggilan);   txt('cv-wanita', CFG.wanita_panggilan);
      txt('h-pria', CFG.pria_panggilan);    txt('h-wanita', CFG.wanita_panggilan);
      txt('f-pria', CFG.pria_panggilan);    txt('f-wanita', CFG.wanita_panggilan);
      txt('cv-tanggal', CFG.tanggal_tampil); txt('h-tanggal', CFG.tanggal_tampil);
      txt('kata-pembuka', CFG.kata_pembuka); txt('kata-penutup', CFG.kata_penutup);

      txt('p-nama', CFG.pria_nama);   txt('p-anak', CFG.pria_anak);
      txt('w-nama', CFG.wanita_nama); txt('w-anak', CFG.wanita_anak);

      ['ak', 'rs'].forEach(function (p) {
        const k = p === 'ak' ? 'akad' : 'resepsi';
        txt(p + '-judul', CFG[k + '_judul']);
        txt(p + '-hari', CFG[k + '_hari_tanggal']);
        txt(p + '-waktu', CFG[k + '_waktu']);
        txt(p + '-tempat', CFG[k + '_tempat']);
        const a = $(p + '-maps');
        if (CFG[k + '_maps']) a.href = CFG[k + '_maps']; else a.style.display = 'none';
      });

      if (CFG.tamu) { txt('cv-nama', CFG.tamu); $('cv-guest').hidden = false; }

      // Mengisi Foto Mempelai
      function setPhoto(id, url, initial, alt) {
        const box = $(id);
        box.textContent = initial;
        if (!url) return;
        const img = new Image();
        img.alt = alt;
        img.onload = function () { box.textContent = ''; box.appendChild(img); };
        img.src = url;
      }
      const ini = s => (s || '?').trim().charAt(0).toUpperCase();
      setPhoto('ph-pria', CFG.pria_foto, ini(CFG.pria_panggilan), 'Foto ' + CFG.pria_nama);
      setPhoto('ph-wanita', CFG.wanita_foto, ini(CFG.wanita_panggilan), 'Foto ' + CFG.wanita_nama);

      // Foto latar cover
      if (CFG.cover_foto) {
        const c = $('cover');
        c.style.backgroundImage = 'url("' + CFG.cover_foto.replace(/"/g, '%22') + '")';
      }

      // ===== Musik =====
      // Link Google Drive sudah diubah otomatis oleh Apps Script (toAudioUrl_)
      const music = $('bg-music');
      const btnMusic = $('btn-music');
      if (CFG.musik_url) {
        music.src = CFG.musik_url;
        music.load();
      }

      // Tombol musik: play / pause (didaftarkan sekali saja)
      btnMusic.addEventListener('click', function () {
        if (music.paused) {
          music.play().then(function () {
            btnMusic.classList.remove('paused');
          }).catch(function (e) {
            console.log('Musik gagal diputar:', e);
          });
        } else {
          music.pause();
          btnMusic.classList.add('paused');
        }
      });

      // Aktifkan Tombol Buka Undangan & Putar Musik
      btnOpen.textContent = "Buka Undangan";
      btnOpen.addEventListener('click', function () {
        $('cover').classList.add('hide');
        $('content').classList.add('show');
        document.body.classList.remove('locked');
        window.scrollTo(0, 0);
        setTimeout(function () { $('cover').style.display = 'none'; }, 1400);

        // Tombol musik hanya muncul kalau musik_url terisi
        if (CFG.musik_url) {
          btnMusic.style.display = 'flex';
          music.play().catch(function (e) {
            console.log('Musik tertahan oleh browser:', e);
            btnMusic.classList.add('paused');
          });
        }
      });

      // Hitung Mundur
      const target = new Date(CFG.countdown_target).getTime();
      if (isNaN(target)) { $('cd').style.display = 'none'; return; }
      function tick() {
        let diff = target - Date.now();
        if (diff <= 0) {
          $('cd').style.display = 'none';
          $('cd-done').style.display = 'block';
          return clearInterval(timer);
        }
        const s = Math.floor(diff / 1000);
        $('cd-d').textContent = Math.floor(s / 86400);
        $('cd-h').textContent = Math.floor((s % 86400) / 3600);
        $('cd-m').textContent = Math.floor((s % 3600) / 60);
        $('cd-s').textContent = s % 60;
      }
      const timer = setInterval(tick, 1000);
      tick();

    })
    .catch(error => {
      console.error("Gagal memuat data dari Spreadsheet:", error);
      btnOpen.textContent = "Data gagal dimuat.";
    });
</script>
</body>
</html>
